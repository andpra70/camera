services:
  ubuntu-camera-viewer:
    build: .
    image: ${REGISTRY:-docker.io/andpra70}/${IMAGE_NAME:-ubuntu-camera-viewer}:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      BASE_PATH: ${BASE_PATH:-/}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      CAMERA_ALLOWLIST: ${CAMERA_ALLOWLIST:-}
      CAMERA_SCAN_INTERVAL_MS: ${CAMERA_SCAN_INTERVAL_MS:-10000}
      TARGET_WIDTH: ${TARGET_WIDTH:-640}
      TARGET_HEIGHT: ${TARGET_HEIGHT:-480}
      TARGET_FPS: ${TARGET_FPS:-15}
      MAX_ACTIVE_CAMERAS: ${MAX_ACTIVE_CAMERAS:-2}
      MAX_CLIENTS_PER_CAMERA: ${MAX_CLIENTS_PER_CAMERA:-4}
      CAPTURE_START_TIMEOUT_MS: ${CAPTURE_START_TIMEOUT_MS:-8000}
      CAPTURE_STALL_TIMEOUT_MS: ${CAPTURE_STALL_TIMEOUT_MS:-10000}
      CAPTURE_IDLE_TIMEOUT_MS: ${CAPTURE_IDLE_TIMEOUT_MS:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    stop_grace_period: 15s
